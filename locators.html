<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board - Local Test Shop</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f6f7f9; margin: 0; }
  main { max-width: 560px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 3px #0001; }
  .row { display: flex; gap: 8px; }
  input, select { padding: 8px; }
  #task-input { flex: 1; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding: 8px 0; }
  li.done .task-name { text-decoration: line-through; color: #888; }
  .task-name { flex: 1; }
  button { padding: 6px 12px; cursor: pointer; }
  .filters { margin: 12px 0; }
</style>
</head>
<body>
<main>
  <h1 id="board-title" data-test="board-title">Task Board</h1>

  <div class="row">
    <input id="task-input" name="task" data-test="task-input" placeholder="What needs to be done?">
    <select id="priority-select" name="priority" data-test="priority-select">
      <option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option>
    </select>
    <button id="add-task-btn" class="btn-primary" data-test="add-task-btn">Add</button>
  </div>

  <div class="filters" id="filter-group" data-test="filter-group">
    <button id="filter-all" class="filter-btn" data-test="filter-all" data-filter="all">All</button>
    <button id="filter-active" class="filter-btn" data-test="filter-active" data-filter="active">Active</button>
    <button id="filter-completed" class="filter-btn" data-test="filter-completed" data-filter="completed">Completed</button>
  </div>

  <ul id="task-list" data-test="task-list"></ul>

  <p>
    <span id="task-counter" data-test="task-counter">0 tasks left</span>
    <button id="clear-completed-btn" class="btn-secondary" data-test="clear-completed-btn">Clear completed</button>
  </p>
  <p><a id="home-link" data-test="home-link" href="index.html">Back to home</a></p>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  let tasks = [], nextId = 1, filter = 'all';

  const render = () => {
    const visible = tasks.filter(t => filter === 'all' || (filter === 'active' ? !t.done : t.done));
    $('#task-list').replaceChildren(...visible.map(t => {
      const li = document.createElement('li');
      li.id = `task-item-${t.id}`; li.className = 'task-item' + (t.done ? ' done' : ''); li.dataset.test = 'task-item';

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = `task-checkbox-${t.id}`; cb.className = 'task-checkbox'; cb.dataset.test = 'task-checkbox'; cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; render(); };

      const name = document.createElement('span');
      name.className = 'task-name'; name.dataset.test = 'task-name'; name.textContent = t.text;

      const pri = document.createElement('span');
      pri.className = 'task-priority'; pri.dataset.test = 'task-priority'; pri.textContent = t.priority;

      const del = document.createElement('button');
      del.id = `delete-task-${t.id}`; del.className = 'delete-btn'; del.dataset.test = 'delete-task-btn'; del.textContent = 'Delete';
      del.onclick = () => { tasks = tasks.filter(x => x !== t); render(); };

      li.append(cb, name, pri, del);
      return li;
    }));
    const left = tasks.filter(t => !t.done).length;
    $('#task-counter').textContent = `${left} task${left === 1 ? '' : 's'} left`;
  };

  const add = () => {
    const text = $('#task-input').value.trim();
    if (!text) return;
    tasks.push({ id: nextId++, text, priority: $('#priority-select').value, done: false });
    $('#task-input').value = '';
    render();
  };
  $('#add-task-btn').onclick = add;
  $('#task-input').onkeydown = (e) => { if (e.key === 'Enter') add(); };
  document.querySelectorAll('.filter-btn').forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
  $('#clear-completed-btn').onclick = () => { tasks = tasks.filter(t => !t.done); render(); };
  render();
</script>
</body>
</html>
