<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board - Local Test Shop</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f6f7f9; margin: 0; }
  .shell { max-width: 560px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 3px #0001; }
  .composer { display: flex; gap: 8px; flex-wrap: wrap; }
  .composer .field { flex: 1; display: flex; }
  input, select { padding: 8px; }
  #wq-entry { flex: 1; }
  .view-switch { margin: 12px 0; display: flex; gap: 6px; }
  .chip { padding: 6px 12px; border: 1px solid #ccc; border-radius: 16px; cursor: pointer; user-select: none; background: #fafafa; }
  .chip[aria-pressed="true"] { background: #2b4acb; color: #fff; border-color: #2b4acb; }
  .rows { margin: 8px 0; }
  .entry { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding: 8px 0; }
  .entry.is-finished .entry-text { text-decoration: line-through; color: #888; }
  .entry-text { flex: 1; }
  .action { padding: 6px 12px; cursor: pointer; }
  footer { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h2 id="wq-title">Task Board</h2>
  </header>

  <nav class="view-switch" id="wq-views" aria-label="Task views">
    <div role="button" tabindex="0" class="chip" id="wq-view-1" data-scope="all" aria-pressed="true">Show all</div>
    <div role="button" tabindex="0" class="chip" id="wq-view-2" data-scope="active" aria-pressed="false">Pending</div>
    <div role="button" tabindex="0" class="chip" id="wq-view-3" data-scope="completed" aria-pressed="false">Done</div>
  </nav>

  <section class="composer" id="wq-composer">
    <div class="field">
      <label for="wq-entry" hidden>New task</label>
      <input id="wq-entry" name="entry" placeholder="Enter a new task">
    </div>
    <div class="field-sm">
      <select id="wq-level" name="level" aria-label="Priority">
        <option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option>
      </select>
    </div>
    <div class="field-sm">
      <input type="button" class="action" id="wq-submit" value="Create task">
    </div>
  </section>

  <div class="rows" id="wq-rows" role="list"></div>

  <footer>
    <div>
      <strong id="wq-remaining">0 tasks left</strong>
    </div>
    <div>
      <input type="button" class="action" id="wq-sweep" value="Clear done tasks">
    </div>
  </footer>
  <p><button type="button" class="action" id="wq-exit" onclick="location.href='index.html'">Return to homepage</button></p>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  let tasks = [], nextId = 1, filter = 'all';

  const render = () => {
    const visible = tasks.filter(t => filter === 'all' || (filter === 'active' ? !t.done : t.done));
    $('#wq-rows').replaceChildren(...visible.map(t => {
      const row = document.createElement('div');
      row.setAttribute('role', 'listitem');
      row.id = `wq-entry-${t.id}`; row.className = 'entry' + (t.done ? ' is-finished' : '');

      const wrap = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = `wq-mark-${t.id}`; cb.className = 'mark'; cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; render(); };
      wrap.append(cb);

      const name = document.createElement('div');
      name.className = 'entry-text'; name.textContent = t.text;

      const pri = document.createElement('em');
      pri.className = 'entry-level'; pri.textContent = t.priority;

      const del = document.createElement('a');
      del.href = '#'; del.id = `wq-drop-${t.id}`; del.className = 'drop-link'; del.textContent = 'Remove';
      del.onclick = (e) => { e.preventDefault(); tasks = tasks.filter(x => x !== t); render(); };

      row.append(wrap, name, pri, del);
      return row;
    }));
    const left = tasks.filter(t => !t.done).length;
    $('#wq-remaining').textContent = `${left} task${left === 1 ? '' : 's'} left`;
  };

  const add = () => {
    const text = $('#wq-entry').value.trim();
    if (!text) return;
    tasks.push({ id: nextId++, text, priority: $('#wq-level').value, done: false });
    $('#wq-entry').value = '';
    render();
  };
  $('#wq-submit').onclick = add;
  $('#wq-entry').onkeydown = (e) => { if (e.key === 'Enter') add(); };
  document.querySelectorAll('.chip').forEach(c => {
    const pick = () => {
      filter = c.dataset.scope;
      document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
      render();
    };
    c.onclick = pick;
    c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  $('#wq-sweep').onclick = () => { tasks = tasks.filter(t => !t.done); render(); };
  render();
</script>
</body>
</html>
