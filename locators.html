<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board - Local Test Shop</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f6f7f9; margin: 0; }
  main { max-width: 560px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 3px #0001; }
  .row { display: flex; gap: 8px; }
  input, select { padding: 8px; }
  #todo-text-field { flex: 1; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding: 8px 0; }
  li.done .todo-title { text-decoration: line-through; color: #888; }
  .todo-title { flex: 1; }
  button { padding: 6px 12px; cursor: pointer; }
  .filters { margin: 12px 0; }
</style>
</head>
<body>
<main>
  <h1 id="todo-heading" data-test="todo-heading">Task Board</h1>

  <div class="row">
    <input id="todo-text-field" name="todoText" data-test="todo-text-field" placeholder="What needs to be done?">
    <select id="todo-priority" name="todoPriority" data-test="todo-priority">
      <option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option>
    </select>
    <button id="btn-create-todo" class="primary-action" data-test="btn-create-todo">Add</button>
  </div>

  <div class="filters" id="todo-tabs" data-test="todo-tabs">
    <button id="tab-all" class="tab-btn" data-test="tab-all" data-view="all">All</button>
    <button id="tab-active" class="tab-btn" data-test="tab-active" data-view="active">Active</button>
    <button id="tab-done" class="tab-btn" data-test="tab-done" data-view="completed">Completed</button>
  </div>

  <ul id="todo-list" data-test="todo-list"></ul>

  <p>
    <span id="todo-count" data-test="todo-count">0 tasks left</span>
    <button id="btn-purge-done" class="secondary-action" data-test="btn-purge-done">Clear completed</button>
  </p>
  <p><a id="nav-back-home" data-test="nav-back-home" href="index.html">Back to home</a></p>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  let tasks = [], nextId = 1, filter = 'all';

  const render = () => {
    const visible = tasks.filter(t => filter === 'all' || (filter === 'active' ? !t.done : t.done));
    $('#todo-list').replaceChildren(...visible.map(t => {
      const li = document.createElement('li');
      li.id = `todo-row-${t.id}`; li.className = 'todo-row' + (t.done ? ' done' : ''); li.dataset.test = 'todo-row';

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = `todo-toggle-${t.id}`; cb.className = 'todo-toggle'; cb.dataset.test = 'todo-toggle'; cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; render(); };

      const name = document.createElement('span');
      name.className = 'todo-title'; name.dataset.test = 'todo-title'; name.textContent = t.text;

      const pri = document.createElement('span');
      pri.className = 'todo-badge'; pri.dataset.test = 'todo-badge'; pri.textContent = t.priority;

      const del = document.createElement('button');
      del.id = `todo-delete-${t.id}`; del.className = 'trash-btn'; del.dataset.test = 'todo-trash-btn'; del.textContent = 'Delete';
      del.onclick = () => { tasks = tasks.filter(x => x !== t); render(); };

      li.append(cb, name, pri, del);
      return li;
    }));
    const left = tasks.filter(t => !t.done).length;
    $('#todo-count').textContent = `${left} task${left === 1 ? '' : 's'} left`;
  };

  const add = () => {
    const text = $('#todo-text-field').value.trim();
    if (!text) return;
    tasks.push({ id: nextId++, text, priority: $('#todo-priority').value, done: false });
    $('#todo-text-field').value = '';
    render();
  };
  $('#btn-create-todo').onclick = add;
  $('#todo-text-field').onkeydown = (e) => { if (e.key === 'Enter') add(); };
  document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { filter = b.dataset.view; render(); });
  $('#btn-purge-done').onclick = () => { tasks = tasks.filter(t => !t.done); render(); };
  render();
</script>
</body>
</html>
